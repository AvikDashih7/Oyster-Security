<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Client Testimonials – 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbfcf9;--ink:#06241f;--body:#2c3f3b;--green:#5c9a2a;--star:#e07a00;--dot:92,154,42;--halo:rgba(255,255,255,.9);--ring-bg:#e9ecef;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08130f;--ink:#eaf3ec;--body:#b9cbc3;--halo:rgba(255,255,255,.07);--ring-bg:#1b2b26}}
:root[data-theme="dark"]{--bg:#08130f;--ink:#eaf3ec;--body:#b9cbc3;--halo:rgba(255,255,255,.07);--ring-bg:#1b2b26}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
section{max-width:1000px;margin:0 auto;padding:48px 16px 56px;text-align:center}
.eyebrow{font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:500}
h1{font-size:clamp(28px,5vw,44px);font-weight:600;letter-spacing:-.02em;margin:12px 0 0}
.scene{perspective:1100px;margin-top:20px}
.stage{position:relative;height:540px;transform-style:preserve-3d;transition:transform .25s ease-out;will-change:transform}
canvas#map{position:absolute;inset:0;width:100%;height:100%;transform:translateZ(-120px) scale(1.12);pointer-events:none}
.av{position:absolute;border-radius:50%;padding:0;border:0;cursor:pointer;background:var(--ring-bg);
 box-shadow:0 0 0 8px var(--halo),0 14px 28px rgba(6,36,31,.22);transition:left .9s cubic-bezier(.65,0,.25,1),top .9s cubic-bezier(.65,0,.25,1),width .9s cubic-bezier(.65,0,.25,1),height .9s cubic-bezier(.65,0,.25,1),transform .9s cubic-bezier(.65,0,.25,1),box-shadow .5s;transform-style:preserve-3d}
.av svg{width:100%;height:100%;border-radius:50%;display:block;animation:bob var(--d,6s) ease-in-out infinite;animation-delay:var(--dl,0s)}
.av:hover{box-shadow:0 0 0 8px var(--halo),0 0 0 11px rgba(92,154,42,.5),0 20px 34px rgba(6,36,31,.3)}
.av.main{cursor:default;box-shadow:0 0 0 4px var(--green),0 0 0 14px var(--halo),0 26px 44px rgba(6,36,31,.35)}
.av.main svg{animation:none}
@keyframes bob{0%,100%{transform:translateY(-4px)}50%{transform:translateY(5px)}}
.pulse{position:absolute;left:50%;top:104px;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;border:2px solid var(--green);animation:pulse 2.8s ease-out infinite;pointer-events:none;transform:translateZ(20px)}
@keyframes pulse{0%{transform:translateZ(20px) scale(1);opacity:.55}100%{transform:translateZ(20px) scale(2.1);opacity:0}}
.copy{position:absolute;left:50%;top:190px;width:min(640px,92%);margin-left:calc(min(640px,92%)/-2);transform:translateZ(50px);transform-style:preserve-3d}
.card{transition:opacity .45s,transform .45s}
.card.out{opacity:0;transform:rotateX(-70deg) translateY(10px)}
.card.in{opacity:0;transform:rotateX(70deg) translateY(-10px);transition:none}
.stars{color:var(--star);letter-spacing:4px;font-size:15px}
blockquote{margin:14px 0 14px;font-size:clamp(14px,2.2vw,16px);line-height:1.75;color:var(--body);font-weight:500}
.who{font-weight:600;font-size:15px}
.nav{display:flex;gap:10px;justify-content:center;margin-top:18px}
.nav button{width:24px;height:24px;border-radius:50%;border:0;background:var(--green);color:#fff;cursor:pointer;font-size:13px;line-height:1;transition:transform .2s}
.nav button:hover{transform:translateZ(0) scale(1.2)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
@media (max-width:640px){.stage{height:600px}.av.s{transform:scale(.8)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<section>
  <div class="eyebrow">Client Testimonials</div>
  <h1>Trusted Technology. Proven Results.</h1>
  <div class="scene">
    <div class="stage" id="stage">
      <canvas id="map"></canvas>
      <div class="pulse"></div>
      <div class="copy">
        <div class="card" id="card">
          <div class="stars" aria-label="5 out of 5 stars">★★★★★</div>
          <blockquote id="q"></blockquote>
          <div class="who" id="who"></div>
        </div>
        <div class="nav">
          <button id="prev" aria-label="Previous testimonial">←</button>
          <button id="next" aria-label="Next testimonial">→</button>
        </div>
      </div>
    </div>
  </div>
</section>
<script>
const T=[
{q:"Oyster delivered exactly what we needed. Their team took the time to understand our requirements, recommended the right technology, and handled every stage of the installation with professionalism. The entire process was seamless, and the final solution has given us greater confidence in our security and infrastructure.",w:"Operations Director, Commercial Client",s:"#e8b794",h:"#2a1a14",c:"#8a1c33",f:0},
{q:"From the site survey to the final handover, nothing was left to chance. Our cameras and access control now work as one system, and our staff actually enjoy using it.",w:"Facilities Head, Logistics Group",s:"#c98f65",h:"#16100d",c:"#c0504d",f:0},
{q:"They explained every option in plain language and never pushed for more than we needed. The installation finished a day early.",w:"Managing Director, Retail Chain",s:"#f0c6a8",h:"#3a2418",c:"#e0529a",f:1},
{q:"Response times are excellent. When we added a second warehouse, the same team scaled our network and surveillance without any downtime.",w:"IT Manager, Manufacturing Client",s:"#d9a47c",h:"#1c1410",c:"#7b8794",f:0},
{q:"Clear communication, tidy work, and a system that runs quietly in the background. Exactly what a growing school campus needs.",w:"Administrator, Education Client",s:"#b97b56",h:"#120c0a",c:"#2f6f5e",f:1},
{q:"We trusted Oyster with our most sensitive areas. Their planning and documentation made our audit far easier.",w:"Compliance Lead, Healthcare Client",s:"#e3b08c",h:"#1d130f",c:"#6b1d2a",f:0}
];
function face(p){
  const hair=p.f?`<path d="M18 52c-4-30 8-42 32-42s36 12 32 42c-2 20-4 34-6 40H24c-2-6-4-20-6-40z" fill="${p.h}"/>`:"";
  const top=p.f?`<path d="M30 40c4-12 14-16 22-16s16 6 18 16c-8-4-14-6-20-6s-14 2-20 6z" fill="${p.h}"/>`:`<path d="M30 42c-2-16 8-24 20-24s24 8 20 24c-4-8-10-12-20-12s-16 4-20 12z" fill="${p.h}"/>`;
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" fill="#e9ecef"/>${hair}<path d="M14 100c2-20 16-26 36-26s34 6 36 26z" fill="${p.c}"/><rect x="43" y="62" width="14" height="16" rx="5" fill="${p.s}"/><ellipse cx="50" cy="46" rx="18" ry="21" fill="${p.s}"/>${top}<circle cx="43" cy="47" r="1.8" fill="#222"/><circle cx="57" cy="47" r="1.8" fill="#222"/><path d="M43 57q7 6 14 0" stroke="#7a3b2a" stroke-width="2" fill="none" stroke-linecap="round"/>${p.f?"":'<path d="M34 54q16 22 32 0q-2 14-16 16q-14-2-16-16z" fill="'+p.h+'" opacity=".55"/>'}</svg>`;
}
const SLOTS=[[14,150,64,40],[68,70,56,-40],[89,200,66,70],[5,300,60,90],[26,470,46,-30]];
const stage=document.getElementById('stage'),card=document.getElementById('card'),q=document.getElementById('q'),who=document.getElementById('who');
let cur=0,busy=false,timer;
const els=T.map((p,i)=>{const b=document.createElement('button');b.className='av';b.setAttribute('aria-label','Show testimonial '+(i+1));b.innerHTML=face(p);b.style.setProperty('--d',(5+i*.7)+'s');b.style.setProperty('--dl',(-i*.9)+'s');b.onclick=()=>go(i);stage.appendChild(b);return b});
function layout(){
  const W=stage.clientWidth;
  els.forEach((el,i)=>{
    const off=(i-cur+T.length)%T.length;
    if(off===0){el.classList.add('main');el.classList.remove('s');
      Object.assign(el.style,{left:'50%',top:'104px',width:'96px',height:'96px',transform:'translate(-50%,-50%) translateZ(120px)',zIndex:5});el.tabIndex=-1}
    else{const [x,y,s,z]=SLOTS[off-1];el.classList.remove('main');el.classList.add('s');el.tabIndex=0;
      Object.assign(el.style,{left:(x/100*W)+'px',top:y+'px',width:s+'px',height:s+'px',transform:`translate(-50%,-50%) translateZ(${z}px)`,zIndex:2})}
  });
}
function show(){q.textContent='“'+T[cur].q+'”';who.textContent='— '+T[cur].w}
function go(n){
  if(busy||n===cur)return;busy=true;
  card.classList.add('out');
  cur=(n+T.length)%T.length;layout();
  setTimeout(()=>{show();card.classList.remove('out');card.classList.add('in');void card.offsetWidth;card.classList.remove('in');busy=false},450);
  restart();
}
function restart(){clearInterval(timer);timer=setInterval(()=>go(cur+1),6500)}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
stage.addEventListener('pointerenter',()=>clearInterval(timer));
stage.addEventListener('pointerleave',()=>{restart();stage.style.transform=''});
stage.addEventListener('pointermove',e=>{
  const r=stage.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
  stage.style.transform=`rotateY(${x*14}deg) rotateX(${-y*10}deg)`;
});
/* dotted world map */
const cv=document.getElementById('map'),ctx=cv.getContext('2d');let dots=[];
const land=[[[8,8],[28,6],[34,14],[30,22],[24,30],[20,34],[16,26],[8,18]],[[24,35],[34,37],[36,46],[30,60],[26,52],[24,42]],[[46,10],[56,8],[58,16],[50,20],[45,16]],[[46,23],[58,23],[62,34],[56,48],[50,46],[46,34]],[[56,8],[84,8],[90,18],[82,28],[70,30],[62,24],[56,16]],[[78,42],[90,42],[90,52],[80,52]]];
function buildMap(){
  const w=cv.width=stage.clientWidth,h=cv.height=stage.clientHeight;
  const o=document.createElement('canvas');o.width=w;o.height=h;const c=o.getContext('2d');
  const sx=w*.78/100,sy=h*.72/60,ox=w*.11,oy=h*.28;
  c.fillStyle='#000';land.forEach(p=>{c.beginPath();p.forEach(([x,y],i)=>c[i?'lineTo':'moveTo'](ox+x*sx,oy+y*sy));c.fill()});
  const d=o.getContext('2d').getImageData(0,0,w,h).data;dots=[];
  for(let y=0;y<h;y+=9)for(let x=0;x<w;x+=9)if(d[(y*w+x)*4+3]>128)dots.push([x,y]);
}
const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
function draw(t){
  ctx.clearRect(0,0,cv.width,cv.height);
  const rgb=getComputedStyle(document.documentElement).getPropertyValue('--dot');
  for(const [x,y] of dots){const a=.14+.5*Math.max(0,Math.sin(x*.012-y*.006-t/900))**6;
    ctx.fillStyle=`rgba(${rgb},${a})`;ctx.beginPath();ctx.arc(x,y,2.2,0,6.283);ctx.fill()}
  if(!still)requestAnimationFrame(draw);
}
function init(){buildMap();layout();if(still)draw(0)}
addEventListener('resize',init);
show();init();if(!still){requestAnimationFrame(draw);restart()}
</script>
</body>
</html>
